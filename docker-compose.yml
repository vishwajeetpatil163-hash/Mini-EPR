version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=wholesale-erp-secret-key-2026-production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/wholesale_erp?schema=public
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: wholesale_erp_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wholesale_erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
